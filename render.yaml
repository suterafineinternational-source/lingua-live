services:
  - type: web
    name: lingua-live
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: HOST_RECONNECT_GRACE_MS
        value: "30000"
      - key: ROOM_RETENTION_MS
        value: "3600000"
