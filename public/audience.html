<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Listen to a live interpretation with Lingua Live.">
    <title>Audience · Lingua Live</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell audience-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">Li</span> Lingua Live</div>
        <span class="role-pill">Audience · <span id="room-code"></span></span>
      </header>

      <section class="audience-header">
        <p class="eyebrow" id="event-title">Live interpretation</p>
        <h1 id="language-pair">Connecting…</h1>
      </section>

      <p id="error" class="error hidden" role="alert"></p>
      <section id="pin-panel" class="card pin-card hidden">
        <h2>Enter audience PIN</h2>
        <p class="meta">This event is protected by a PIN from the host.</p>
        <div class="controls"><input id="audience-pin" inputmode="numeric" maxlength="8" placeholder="PIN"><button id="join-room">Join event</button></div>
      </section>

      <section id="caption-stage" class="caption-stage" aria-label="Live translated captions" aria-live="polite">
        <div id="caption-history" class="caption-history"></div>
        <p id="caption-current" class="caption current">Waiting for the host to speak…</p>
      </section>

      <footer class="listener-bar">
        <div><span id="live-pulse" class="pulse"></span><strong id="connection-status">Connecting…</strong><span class="meta"> · <span id="listener-count">0</span> listening</span></div>
        <div class="audio-controls">
          <button id="enable-audio" type="button">Enable translated audio</button>
          <label class="volume-label">Volume <input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
        </div>
      </footer>
    </main>
    <script type="module" src="/audience.js"></script>
  </body>
</html>
