<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lingua Live Captions</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden}body{padding:2vw}.caption{display:inline-block;max-width:96vw;padding:.45em .7em;border-radius:.35em;background:rgba(0,0,0,.78);color:#fff;font-size:clamp(28px,5vw,72px);font-weight:800;line-height:1.15;text-shadow:0 2px 4px #000}.meta{font:16px system-ui;color:#fff;background:rgba(0,0,0,.65);padding:10px;border-radius:8px}.hidden{display:none}.pin{display:flex;gap:8px}.pin input,.pin button{font:18px system-ui;padding:10px}
  </style>
</head>
<body>
  <div id="meta" class="meta">Connecting…</div>
  <div id="pin" class="meta pin hidden"><input id="pin-value" inputmode="numeric" placeholder="Audience PIN"><button id="join">Join</button></div>
  <div id="caption" class="caption hidden">Waiting for interpretation…</div>
  <script type="module" src="/captions.js"></script>
</body>
</html>
