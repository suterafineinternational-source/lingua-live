name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: |
          node --check server.js
          node --check src/app.js
          node --check src/openai-realtime.js
          node --check src/openai-translation-client.js
          node --check src/room-store.js
          node --check src/storage.js
          node --check src/integrations.js
          node --check public/host.js
          node --check public/host-entry.js
          node --check public/low-latency-webrtc.js
          node --check public/translated-relay-worklet.js
          node --check public/quality-bootstrap.js
          node --check public/quality-monitor.js
          node --check public/audience.js
          node --check public/captions.js
          node --check public/embed.js
          node --check scripts/load-smoke.mjs
