name: refresh-lock

on:
  push:
    branches: [codex/realtime-stall-recovery]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/realtime-stall-recovery
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm audit fix --package-lock-only
      - run: npm audit --package-lock-only --audit-level=high
      - name: Commit patched lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: update vulnerable transitive dependency lock"
          git push origin HEAD:codex/realtime-stall-recovery
